; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; This got inspiration from https://github.com/arendst/Sonoff-Tasmota

[platformio]
src_dir                   = EspaperClient
; Unit tests live in test/host and are HOST-ONLY. PlatformIO cannot exclude a root test suite from
; an env (test_ignore/test_filter do not match it). A bare `pio run` builds the firmware (default_envs);
; the native env has no main() and cannot be linked, so it is only for `pio test -e native`, which
; must always be passed -e. Never run `pio test -e <device env>` (or a bare `pio test`) -- it would
; try to build the host suite for Xtensa. Scripts and CI always pass -e explicitly.
test_dir                  = test/host
default_envs              = Espaper29Bw-PROD


; *** Uncomment one of the lines below to build/upload only one environment
; env_default               = Espaper29Bw-PROD
; env_default               = Espaper29Bw-TEST
; env_default               = Espaper29Bw-DEV
; env_default               = Espaper42Bw-PROD
; env_default               = Espaper42Bw-TEST
; env_default               = Espaper42Bw-DEV
; env_default               = TTGOT529Bw-PROD
; env_default               = TTGOT529Bw-TEST
; env_default               = TTGOT529Bw-DEV
; env_default               = Espaper75Bw-PROD
; env_default               = Espaper75Bw-TEST
; env_default               = Espaper75Bw-DEV
; env_default               = ESPColorKit-TEST

[common]
client_version            = -DCLIENT_VERSION=V031
monitor_speed             = 115200
upload_speed              = 921600
upload_resetmethod        = nodemcu

; MiniGrafx is NOT published in the PlatformIO registry, so upstream's bare
; "Mini Grafx@1.2.2" silently failed to resolve. It is now vendored under
; lib/MiniGrafx with a required local fix -- see lib/MiniGrafx/VENDORED.md.
lib_deps                  =

; *** Upload Serial reset method for Wemos and NodeMCU
; Upstream hardcodes /dev/cu.SLAB_USBtoUART, the name Silicon Labs' own kext
; gives a CP2102. macOS now has a built-in CP210x driver, which enumerates the
; same chip as /dev/cu.usbserial-0001 instead. Left unset so PlatformIO
; autodetects; scripts/flash.sh does the flashing anyway.
; upload_port             = /dev/cu.usbserial-0001
extra_scripts             = pio/hooks.py


[esp8266]
; Upstream pinned espressif8266@2.2.0 (Arduino core 2.5.0, GCC 4.8.2). That
; toolchain hits an internal compiler error -- "in bot_manip, at cp/tree.c:3055"
; -- on the core's own core_esp8266_version.h, so it cannot build at all today.
; 4.2.1 ships Arduino core 3.1.2 with GCC 10.3.
platform                  = espressif8266@4.2.1
build_flags               = -D NDEBUG
                            -mtarget-align
                            ${common.client_version}
                            -Wl,-Map,firmware.map
; lwIP 1.4 (Default)
;                            -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH
; lwIP 2 - Low Memory
;                            -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
; lwIP 2 - Higher Bandwidth
;                            -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
; lwIP 2 - Higher Bandwidth Low Memory no Features
;                            -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
; lwIP 2 - Higher Bandwidth no Features (Tasmota default)
                            -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
                            -DVTABLES_IN_FLASH
                            -fno-exceptions
                            -lstdc++
framework                 = arduino
board                     = esp_wroom_02
board_build.flash_mode    = dout
; Matches DEVICE_FS in EspaperClient/settings.h -- SPIFFS is deprecated in
; Arduino core 3.x and warns on every call site.
board_build.filesystem    = littlefs
; 2MB flash, 512KB filesystem. Upstream passed this as -Wl,-Teagle.flash.2m512.ld
; in build_flags, which PlatformIO now warns about on every build.
board_build.ldscript      = eagle.flash.2m512.ld

; *** Fix espressif8266@1.7.0 induced undesired all warnings
; NOTE: upstream declares build_unflags twice in this section. PlatformIO 2.x
; tolerated the duplicate key; PlatformIO 6 rejects the whole file with
; "option 'build_unflags' in section 'esp8266' already exists". Deduplicated.
build_unflags             = -Wall

; set CPU frequency to 80MHz (default) or 160MHz
board_build.f_cpu         = 80000000L
;board_build.f_cpu         = 160000000L

[esp32]
framework = arduino
board = esp-wrover-kit
platform = espressif32
;board_build.flash_mode = ${common.board_build.flash_mode}
board_build.f_cpu         = 80000000L
;board_build.f_cpu         = 160000000L
;build_unflags = ${common.build_unflags}
build_flags = ${common.client_version}

[env:Espaper29Bw-PROD]
platform = ${esp8266.platform}
framework = ${esp8266.framework}
board = ${esp8266.board}
board_build.flash_mode = ${esp8266.board_build.flash_mode}
board_build.f_cpu = ${esp8266.board_build.f_cpu}
build_unflags = ${esp8266.build_unflags}
build_flags = ${esp8266.build_flags} -DESPAPER29BW
monitor_speed = ${common.monitor_speed}
upload_resetmethod = ${common.upload_resetmethod}
upload_speed = ${common.upload_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}

