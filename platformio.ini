; Host build of the firmware's EspaperParser, run against a live local server (test/host).
; Deliberately NOT inheriting ${esp8266.build_flags}: those carry the Xtensa linker script.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
; -funsigned-char: char is unsigned on the Xtensa device, and artwork.h's byte tables (0xff in a char[])
; do not compile with a signed char. This matches the device; it does not silence a warning.
build_flags = -std=gnu++17 -funsigned-char -I test/host/shims -DESPAPER_HOST_TEST
build_src_filter = -<*> +<EspaperParser.cpp>
