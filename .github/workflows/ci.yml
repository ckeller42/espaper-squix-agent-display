name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level; widened per-job only where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same detect-secrets hook developers run locally via scripts/gate.sh --
      # one config, two places, no separate CI-only scanner to drift.
      - name: Secret scan
        uses: pre-commit/action@v3.0.1

      # The image is linux/amd64 and so is the runner, so this is a native
      # build -- no QEMU, unlike on an Apple Silicon dev machine.
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: squix-espaper-build:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile
        run: |
          docker run --rm \
            -v "$PWD:/project" -w /project \
            -u "$(id -u):$(id -g)" \
            squix-espaper-build:ci \
            pio run -e Espaper29Bw-PROD 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      # A warning-free build is part of "done" here, so make CI enforce it
      # instead of trusting everyone to read the scrollback. -Werror is not
      # used because it would also fail on warnings from framework headers
      # we do not control; this checks the build output we actually own.
      - name: Fail on compiler warnings
        run: |
          if grep -iE "warning" build.log; then
            echo "::error::Build produced warnings (see above). Fix them at the source."
            exit 1
          fi
          echo "Build is warning-free."

      - name: Report size
        run: |
          docker run --rm \
            -v "$PWD:/project" -w /project \
            -u "$(id -u):$(id -g)" \
            squix-espaper-build:ci \
            pio run -e Espaper29Bw-PROD -t size

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: espaper-firmware
          path: |
            .pio/build/Espaper29Bw-PROD/firmware.bin
            target/Espaper29Bw-PROD-*.bin
          if-no-files-found: error
