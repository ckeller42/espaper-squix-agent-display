name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level; widened per-job only where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit + payload parity + fake-device protocol tests. See
  # docs/simulation-and-testing.md for what each layer does and does not prove.
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    # A hung test must not burn the default six hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run tests
        # --frozen: fail if uv.lock is out of date rather than silently re-resolving.
        run: uv run --frozen --python 3.12 pytest

  # The firmware's real EspaperParser, compiled for the host, against a live
  # Python server that the test binary starts itself.
  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The harness execs server/.venv/bin/python (see test_parser_e2e.cpp).
      - name: Provision the server venv
        run: uv sync --frozen --python 3.12 --project server

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      # -e is mandatory: platformio.ini defaults to native, and `pio test -e
      # <device env>` fails by design (the host suite cannot build for Xtensa).
      - name: Run native tests
        run: pio test -e native

  firmware:
    name: Build firmware
    # Pinned, not ubuntu-latest: the floating label emits a migration notice on
    # every run and silently changes the toolchain underneath us. The firmware
    # toolchain itself lives in our Docker image, so the runner only needs to be
    # a stable x86_64 Linux host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Same detect-secrets hook developers run locally via scripts/gate.sh --
      # one config, two places, no separate CI-only scanner to drift.
      - name: Secret scan
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files

      # The image is linux/amd64 and so is the runner, so this is a native
      # build -- no QEMU, unlike on an Apple Silicon dev machine.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: squix-espaper-build:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile
        run: |
          docker run --rm \
            -v "$PWD:/project" -w /project \
            -u "$(id -u):$(id -g)" \
            squix-espaper-build:ci \
            pio run -e Espaper29Bw-PROD 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      # A warning-free build is part of "done" here, so make CI enforce it
      # instead of trusting everyone to read the scrollback. -Werror is not
      # used because it would also fail on warnings from framework headers
      # we do not control; this checks the build output we actually own.
      - name: Fail on compiler warnings
        run: |
          if grep -iE "warning" build.log; then
            echo "::error::Build produced warnings (see above). Fix them at the source."
            exit 1
          fi
          echo "Build is warning-free."

      - name: Report size
        run: |
          docker run --rm \
            -v "$PWD:/project" -w /project \
            -u "$(id -u):$(id -g)" \
            squix-espaper-build:ci \
            pio run -e Espaper29Bw-PROD -t size

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: espaper-firmware
          path: |
            .pio/build/Espaper29Bw-PROD/firmware.bin
            target/Espaper29Bw-PROD-*.bin
          if-no-files-found: error
